<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>mickael.aerophoto | Suivi clients</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#111418;--mut:#6b7380;--line:#e1e4e9;--ac:#e8590c;--ok:#2b8a3e;--wait:#e8590c;--prog:#1c7ed6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0e13;--card:#141922;--tx:#f1f3f6;--mut:#8b94a3;--line:#232a36;--ok:#51cf66;--wait:#ff922b;--prog:#4dabf7}}
:root[data-theme="dark"]{--bg:#0b0e13;--card:#141922;--tx:#f1f3f6;--mut:#8b94a3;--line:#232a36;--ok:#51cf66;--wait:#ff922b;--prog:#4dabf7}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.logo{font-family:Oswald,sans-serif;letter-spacing:.04em;font-size:1.1rem}.logo b{color:var(--ac);font-weight:600}
h1{font-family:Oswald,sans-serif;font-weight:600;font-size:clamp(2rem,6vw,3.2rem);letter-spacing:.03em;margin:.4em 0 .1em;text-transform:uppercase}
.sub{color:var(--mut);margin:0 0 24px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font-family:Oswald,sans-serif;font-size:1.8rem}.stat span{color:var(--mut);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--wait);border-radius:12px;padding:18px;margin-bottom:12px}
.card.prog{border-left-color:var(--prog)}.card.done{border-left-color:var(--ok);opacity:.8}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.name{font-family:Oswald,sans-serif;font-size:1.4rem;letter-spacing:.03em}
.badge{border:0;cursor:pointer;font:600 .75rem Inter,sans-serif;text-transform:uppercase;letter-spacing:.08em;padding:6px 12px;border-radius:99px;color:#fff;background:var(--wait)}
.prog .badge{background:var(--prog)}.done .badge{background:var(--ok);color:#0b0e13}
.task{margin:8px 0;font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{font-size:.8rem;border:1px solid var(--line);border-radius:99px;padding:3px 12px;color:var(--mut)}
.chip.dl{color:var(--ac);border-color:var(--ac);font-weight:600}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}.step{flex:1;min-width:130px;cursor:pointer;font:600 .85rem Inter,sans-serif;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--mut);text-align:left}.step.past{color:var(--tx);border-color:var(--mut)}.step.on{background:var(--ac);border-color:var(--ac);color:#fff}
.del{background:none;border:0;color:var(--mut);cursor:pointer;font-size:.8rem;margin-top:10px;padding:0}
details{margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
summary{cursor:pointer;font-family:Oswald,sans-serif;letter-spacing:.05em;text-transform:uppercase}
form{display:grid;gap:10px;margin-top:14px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.go{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:12px;font:600 .9rem Inter,sans-serif;cursor:pointer}
@media(max-width:520px){.row{grid-template-columns:1fr}}
#gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:99;padding:20px}
#gate form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;width:100%;max-width:340px;margin:0}
#gate p{margin:0;color:var(--mut);font-size:.9rem}#err{color:#e03131;min-height:1.2em}
.locked .wrap{display:none}
.back{display:inline-block;margin-top:24px;color:var(--mut);font-size:.85rem}
</style>
</head>
<body class="locked">
<div id="gate"><form id="g"><div class="logo">mickael<b>.aerophoto</b></div><p>Espace privé : suivi clients</p>
<input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password" required><div id="err"></div><button class="go">Entrer</button></form></div>
<div class="wrap">
  <div class="logo">mickael<b>.aerophoto</b></div>
  <h1>Suivi clients</h1>
  <p class="sub">Où j’en suis avec chaque client — <span id="today"></span></p>
  <div class="stats">
    <div class="stat"><b id="s1">0</b><span>Pas shooté</span></div>
    <div class="stat"><b id="s2">0</b><span>Retouche / montage</span></div>
    <div class="stat"><b id="s3">0</b><span>Livrés</span></div>
  </div>
  <div id="list"></div>
  <details>
    <summary>+ Ajouter un client</summary>
    <form id="f">
      <input id="n" placeholder="Nom du client" required>
      <input id="t" placeholder="Tâche en cours (ex. montage vidéo)" required>
      <input id="d" type="date" aria-label="Date limite d’envoi">
      <div class="row">
        <input id="h" type="time" aria-label="Heure limite d’envoi">
        <select id="l"><option>Photo et vidéo</option><option>Photo</option><option>Vidéo</option></select>
      </div>
      <button class="go">Ajouter</button>
    </form>
  </details>
  <a class="back" href="./">← Retour au site</a>
</div>
<script>
var HASH="b0fa9cdc0962d37fe668d6561681e5763670d7495546e342863fa2b9fe967ecf";
function sha(x){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(x)).then(function(b){return Array.from(new Uint8Array(b)).map(function(v){return v.toString(16).padStart(2,"0")}).join("")})}
function unlock(){document.getElementById("gate").style.display="none";document.body.classList.remove("locked")}
try{if(sessionStorage.getItem("aero-ok")==="1")unlock()}catch(e){}
document.getElementById("g").onsubmit=function(e){e.preventDefault();sha(document.getElementById("pw").value).then(function(x){
 if(x===HASH){try{sessionStorage.setItem("aero-ok","1")}catch(e){}unlock()}else document.getElementById("err").textContent="Mot de passe incorrect"})};

var ST=["attente","cours","livré"],LB={attente:"Pas encore shooté",cours:"Retouche / montage","livré":"Livré"},KEY="aero-clients";
var clients=[{id:1,name:"Mme Nadia",task:"Finir le montage vidéo, puis envoi",date:"2026-10-24",time:"13:00",deliv:"Photo et vidéo",st:"cours"}];
try{var s=localStorage.getItem(KEY);if(s)clients=JSON.parse(s)}catch(e){}
clients.forEach(function(c){if(c.id===1&&!c.date)c.date="2026-10-24"});
function fd(x){return new Date(x+"T00:00:00").toLocaleDateString("fr-CH",{day:"numeric",month:"long",year:"numeric"})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(clients))}catch(e){}}
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function left(c){if(!c.time)return"";var d=new Date(),p=c.time.split(":"),e=c.date?new Date(c.date+"T00:00:00"):new Date();e.setHours(+p[0],+p[1],0,0);var m=Math.round((e-d)/60000);
 if(m<0)return"Échéance dépassée";var j=Math.floor(m/1440),hh=Math.floor((m%1440)/60);return"Reste "+(j?j+" j ":"")+(hh?hh+" h ":"")+(m%60)+" min"}
function render(){
 document.getElementById("today").textContent=new Date().toLocaleDateString("fr-CH",{weekday:"long",day:"numeric",month:"long"});
 ["attente","cours","livré"].forEach(function(k,i){document.getElementById("s"+(i+1)).textContent=clients.filter(function(c){return c.st===k}).length});
 document.getElementById("list").innerHTML=clients.map(function(c){
  var cls=c.st==="cours"?"prog":c.st==="livré"?"done":"";
  return '<div class="card '+cls+'"><div class="top"><div class="name">'+esc(c.name)+'</div><span class="badge">'+LB[c.st]+'</span></div>'
  +'<div class="task">'+esc(c.task)+'</div><div class="steps">'+["1. Pas encore shooté","2. Retouche / montage","3. Livré"].map(function(l,i){var cur=ST.indexOf(c.st);return '<button class="step '+(i===cur?'on':i<cur?'past':'')+'" data-a="step" data-s="'+i+'" data-id="'+c.id+'">'+l+'</button>'}).join("")+'</div><div class="meta">'
  +(c.time?'<span class="chip dl">Envoi au plus tard '+(c.date?'le '+esc(fd(c.date))+' ':'')+'à '+esc(c.time.replace(":","h"))+(c.st!=="livré"?" · "+left(c):"")+'</span>':'')
  +'<span class="chip">'+esc(c.deliv)+'</span></div><button class="del" data-a="del" data-id="'+c.id+'">Supprimer</button></div>'}).join("")||'<p class="sub">Aucun client pour l’instant.</p>';
}
document.getElementById("list").onclick=function(e){var b=e.target.closest("button");if(!b)return;var id=+b.dataset.id;
 if(b.dataset.a==="step"){clients.forEach(function(c){if(c.id===id)c.st=ST[+b.dataset.s]})}
 else clients=clients.filter(function(c){return c.id!==id});save();render()};
document.getElementById("f").onsubmit=function(e){e.preventDefault();
 clients.push({id:Date.now(),name:n.value,task:t.value,date:d.value,time:h.value,deliv:l.value,st:"attente"});save();render();e.target.reset()};
render();setInterval(render,60000);
</script>
</body>
</html>
